
[functions.production-agent]
# Pairing uses a short-lived single-use code; all subsequent calls use the
# rotated agent secret validated inside the function.
verify_jwt = false

[functions.process-supplier-document]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.repair-supplier-document-profile]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.delete-supplier-document]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.billing]
# JWT is validated with auth.getUser() and tenant membership/role checks inside.
verify_jwt = false

[functions.billing-webhook]
# Mollie webhooks are unsigned: only the payment id is read and its state is re-fetched from the Mollie API.
verify_jwt = false

[functions.billing-reconcile]
# Separate scheduler secret validated inside.
verify_jwt = false

[functions.activate-personal]
# Validates the POS session before forwarding to the configured Personal backend.
verify_jwt = false

