name: Verify and request staging deployment

on:
  push:
    branches:
      - Staging
  workflow_dispatch:
    inputs:
      mode:
        description: Verify only, or request a private staging deployment
        required: true
        default: check
        type: choice
        options:
          - check
          - deploy

permissions:
  contents: read

concurrency:
  group: pos-staging
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    name: Verify staging without infrastructure access
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Validate staging branch
        run: test "$GITHUB_REF" = refs/heads/Staging

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application and migration tooling
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          pnpm lint
          pnpm test
          pnpm build

  request-deployment:
    name: Request private staging deployment
    needs: verify
    if: vars.PRIVATE_DEPLOY_STAGING_ENABLED == 'true' && vars.STAGING_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.mode == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verified release
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Request deployment and wait for the private result
        env:
          DEPLOY_ENVIRONMENT: staging
          CF_ACCESS_CLIENT_ID: ${{ secrets.STAGING_DEPLOY_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_DEPLOY_CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/request-deployment.mjs
