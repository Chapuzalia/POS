name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: pos-production
  queue: max
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    name: Migrate database and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve last successful production release
        id: release
        uses: actions/github-script@v7
        env:
          CONFIGURED_BASELINE_SHA: ${{ vars.PRODUCTION_BASE_SHA }}
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'production.yml',
                branch: 'main',
                status: 'success',
                per_page: 100,
              },
            )
            const previous = runs.find((run) => run.head_sha !== context.sha)
            const configuredBaseline = process.env.CONFIGURED_BASELINE_SHA?.trim()
            const baselineSha = previous?.head_sha ?? configuredBaseline
            if (!baselineSha || !/^[0-9a-f]{40}$/i.test(baselineSha)) {
              core.setFailed('No previous successful production release was found. Set the PRODUCTION_BASE_SHA repository variable to the exact commit currently in production for the first protected deploy.')
              return
            }
            core.setOutput('base_sha', baselineSha)
            core.setOutput('supported_versions', context.sha)
            core.info(`Production baseline: ${baselineSha}${previous ? '' : ' (configured bootstrap)'}`)

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Validate migrations directory
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d "supabase/migrations" ]]; then
            echo "Missing supabase/migrations directory."
            exit 1
          fi

          migration_count="$(
            find supabase/migrations \
              -maxdepth 1 \
              -type f \
              -name '*.sql' \
              | wc -l
          )"

          if [[ "$migration_count" -eq 0 ]]; then
            echo "No SQL migrations found."
            exit 1
          fi

          echo "Found $migration_count migration files."

      - name: Check migrations for destructive operations
        env:
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/check-pr-migrations.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application before database changes
        run: |
          pnpm run lint
          pnpm test
          pnpm run build

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Build staged production deployment in Vercel
        id: staged
        env:
          APP_VERSION: ${{ github.sha }}
          SUPPORTED_APP_VERSIONS: ${{ steps.release.outputs.supported_versions }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -Eeuo pipefail
          vercel deploy --yes --prod --skip-domain \
            --build-env APP_VERSION="$APP_VERSION" \
            --build-env SUPPORTED_APP_VERSIONS="$SUPPORTED_APP_VERSIONS" \
            --token=${{ secrets.VERCEL_TOKEN }} > staged-deployment-url.txt
          deployment_url="$(tail -n 1 staged-deployment-url.txt)"
          if [[ ! "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "Vercel did not return a valid staged deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/pos-production"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/pos-production"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Backup and apply production migrations
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -Eeuo pipefail

          package_root="$(mktemp -d)"
          node scripts/prepare-production-migrations.mjs \
            supabase/migrations \
            "$package_root/migrations"

          tar -czf - -C "$package_root" migrations \
            | ssh \
                -T \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=15 \
                -i "$HOME/.ssh/pos-production" \
                "${SSH_USER}@${SSH_HOST}"

      - name: Promote verified production deployment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.staged.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --token=${{ secrets.VERCEL_TOKEN }}
