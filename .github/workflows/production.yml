name: Verify and request production deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pos-production
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release without production access
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application and migration tooling
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          pnpm lint
          pnpm test
          pnpm build

  request-deployment:
    name: Request private production deployment
    needs: verify
    # Deliberately disabled until the private controller is installed and approved.
    if: vars.PRIVATE_DEPLOY_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verified release
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Request deployment and wait for the private result
        env:
          DEPLOY_ENVIRONMENT: production
          CF_ACCESS_CLIENT_ID: ${{ secrets.PROD_DEPLOY_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.PROD_DEPLOY_CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/request-deployment.mjs
