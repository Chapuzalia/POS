name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pos-production
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    name: Migrate database and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate migrations directory
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d "supabase/migrations" ]]; then
            echo "Missing supabase/migrations directory."
            exit 1
          fi

          migration_count="$(
            find supabase/migrations \
              -maxdepth 1 \
              -type f \
              -name '*.sql' \
              | wc -l
          )"

          if [[ "$migration_count" -eq 0 ]]; then
            echo "No SQL migrations found."
            exit 1
          fi

          echo "Found $migration_count migration files."

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/pos-production"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/pos-production"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Backup and apply production migrations
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -Eeuo pipefail

          tar -czf - -C supabase migrations \
            | ssh \
                -T \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=15 \
                -i "$HOME/.ssh/pos-production" \
                "${SSH_USER}@${SSH_HOST}"

      - name: Configure Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
