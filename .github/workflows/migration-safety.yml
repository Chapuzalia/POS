name: Migration safety

on:
  pull_request:
    branches:
      - main
      - Staging

permissions:
  contents: read

jobs:
  check-migrations:
    name: Check PR migrations against the PR base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Run migration safety checker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # The synthetic merge includes the current PR base. This is a code
          # review check; the private host validates actual pending DB migrations.
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          bash scripts/check-pr-migrations.sh "$BASE_SHA" "$HEAD_SHA"
